services:
  - type: web
    name: orca-ai-api-qa
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: QA_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: orca-ai-qa-db
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          name: orca-ai-web-qa
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: orca-ai-web-qa
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm --workspace apps/web run build
    startCommand: npm --workspace apps/web run start -- -p $PORT
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: orca-ai-api-qa
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: orca-ai-qa-db
    databaseName: orca_ai_qa
    user: orca_ai_qa
    plan: free
    region: singapore
    postgresMajorVersion: 16
