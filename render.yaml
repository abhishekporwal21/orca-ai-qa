services:
  - type: web
    name: orca-ai-api-qa
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: QA_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: orca-ai-qa-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: CORS_ORIGIN
        value: https://orca-ai-web-qa.onrender.com
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: orca-ai-web-qa
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm --workspace apps/web run build
    startCommand: npm --workspace apps/web run start -- -p $PORT
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://orca-ai-api-qa.onrender.com

databases:
  - name: orca-ai-qa-db
    databaseName: orca_ai_qa
    user: orca_ai_qa
    plan: free
    region: singapore
    postgresMajorVersion: 16
