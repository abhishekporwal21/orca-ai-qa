services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orca-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca_dev_password
      POSTGRES_DB: orca_ai
    ports:
      - "5432:5432"
    volumes:
      - orca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  orca_pgdata:
